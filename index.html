function renderHelp(){openModal('help',`<h2 id="modal-title">使用说明</h2><p class="modal-sub">先看价格口径，再比较实际费用。</p><div class="help"><h3>模型与计费档位</h3><p>输入、输出、缓存读取和写入均以百万 token 为单位。切换档位后用量会保留。DeepSeek 档位由你选择，不以星期推断法定节假日。</p><h3>缓存与不完整费用</h3><p>未缓存输入、读取和写入是互不重叠的用量。显式缓存可能另收存储费，单位为百万 token·小时。缺少单价且填写用量时，只显示“已知项小计”，不能保存为完整试算。空白、负数或超范围输入会就地提示。</p><h3>Coding Plan</h3><p>展示常规月付价，“起”代表最低档起价；促销与使用限制在详情列出。额度窗口、积分、请求数不能互相等价，也不能等同于 API 余额。套餐由人工维护。</p><h3>更新与离线</h3><p>网站定时尝试更新官方价格，只有通过校验的记录才会更新。失败或待核对的记录保留旧值，各来源状态见“来源”。基准快照日期不代表全库最近核验日期。页面数据、样式与脚本均已内置，下载后可离线搜索、比较和试算；官方链接需联网。</p><h3>快捷操作与本地保存</h3><p>⌘ / Ctrl + K 定位搜索，Tab 切换控件，Esc 返回。关注与最近 20 条试算保存在当前浏览器，不跨设备同步。从本地文件切换到网站后，记录不会自动迁移。导出仅包含当前筛选结果；USD 与 CNY 分开排序和比较，不做汇率换算。</p></div>`)}
function exportCSV(){if(!filtered.length)return;const models=mode()==='models';const headers=models?['模型ID','名称','供应商','币种','档位','输入/百万tokens','输出/百万tokens','缓存读取/百万tokens','缓存写入/百万tokens','缓存存储/百万token小时','快照日期','来源']:['套餐','供应商','币种','月付价格','是否起价','包含额度','适用工具','使用边界','首月优惠','快照日期','来源'];const rows=filtered.map(x=>isModel(x)?[x.id,x.name,x.provider,mCur(x),rate(x).label,rate(x).input,rate(x).output,rate(x).read??'未单列',rate(x).write??'未单列',rate(x).storage??'不适用/未列',DATA.snapshot,source(x.source)?.url??'']:(pc=>[x.name,x.provider,pc.currency,pc.price,x.starting?'是':'否',pc.quota,pc.tools||x.tools||'',pc.note,pc.promo||'',DATA.snapshot,source(pc.source||x.source)?.url??''])(planCur(x)));const csv='\uFEFF'+[headers,...rows].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='llm-price-radar-'+(models?'models':'coding-plans')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify(`已导出当前筛选的 ${filtered.length} 项。`)}
$('#search').addEventListener('input',e=>{state.searchFold={};state.query=e.target.value;render()});
$('#provider').onchange=e=>{state.searchFold={};state.provider=e.target.value;render()};$('#sort').onchange=e=>{state.searchFold={};state.sort=e.target.value;render()};$('#export').onclick=exportCSV;
document.addEventListener('change',e=>{if(e.target.matches('[data-compare]'))compareToggle(e.target.dataset.compare);if(e.target.id==='detail-tier'){const m=activeItem();draft(m).tier=Number(e.target.value);render();if(modalType==='detail')refreshDetail();const root=modalType==='detail'?$('#modal-body'):$('#detail');root?.querySelector('#detail-tier')?.focus()}});
document.addEventListener('input',e=>{if(!e.target.matches('[data-usage]'))return;const m=activeItem();draft(m).values[Number(e.target.dataset.usage)]=e.target.value;updateBill(m,e.target.closest('.inspector'))});
document.addEventListener('click',e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.matches('.brand')){e.preventDefault();route('models');return}
 if(b.dataset.view){closeModal(false);route(b.dataset.view);return}
 if(b.dataset.kind){state.kind=b.dataset.kind;state.compare=[];resetFilters();return}
 if(b.dataset.open){displayDetail(b.dataset.open);return}
 if(b.dataset.region){b.dataset.provider.split('|').forEach(p=>{state.planRegion[p]=b.dataset.region});save('llmpr-plan-region',state.planRegion);revalidateCompare();render();if(modalType==='detail')refreshDetail();const root=modalType==='detail'?$('#modal-body'):$('#view-content');const sw=root&&root.querySelector(`[data-region="${CSS.escape(b.dataset.region)}"][data-provider="${CSS.escape(b.dataset.provider)}"]`);if(sw)sw.focus();return}if(b.dataset.star){star(b.dataset.star);return}
 if(b.dataset.compareButton){compareToggle(b.dataset.compareButton);return}
 if(b.dataset.step){const id=mode()==='models'?state.selected:state.planSelected;const i=filtered.findIndex(x=>x.id===id)+Number(b.dataset.step);if(filtered[i])displayDetail(filtered[i].id);return}
 if(b.dataset.record){restoreRecord(b.dataset.record);return}
 if(b.dataset.delete){const previous=[...state.records];state.records=state.records.filter(r=>r.id!==b.dataset.delete);save('llmpr-mvp-records',state.records);renderHistory();notify('已删除试算记录。');return}
 switch(b.dataset.action){case 'sources':route('sources');break;case 'models':case 'browse':route(mode()==='plans'?'plans':'models');break;case 'help':renderHelp();break;case 'reset':resetFilters();break;case 'clear-compare':state.compare=[];render();break;case 'compare':renderCompare();break;case 'close':closeModal();break;case 'recover':closeModal();route('models');break;case 'save-calc':saveCalculation();break;case 'reset-usage':{const m=activeItem();draft(m).values=['1','0','0','.5','0'];refreshDetail();break}}
});
document.addEventListener('click',e=>{const lbl=e.target.closest('.vendor-label');if(!lbl||!lbl.dataset.group)return;if(e.target.closest('.region-switch'))return;toggleGroup(lbl.dataset.group)});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#modal').open)closeModal();if(!['models','plans','saved'].includes(state.view))route('models');$('#search').focus()}if(e.key==='Escape'&&!$('#modal').open&&state.query){resetFilters();$('#search').focus()}});
narrow.addEventListener('change',()=>{if(!narrow.matches&&modalType==='detail')closeModal();render()});
function offline(){ $('#offline').hidden=navigator.onLine }window.addEventListener('online',offline);window.addEventListener('offline',offline);offline();
function boot(){try{DATA=JSON.parse($('#model-data').textContent);PLANS=JSON.parse($('#plan-data').textContent);if(!Array.isArray(DATA.models)||!DATA.models.length||!Array.isArray(PLANS.plans)||!DATA.models.every(m=>m.id&&Array.isArray(m.rates)&&m.rates.length))throw Error('数据格式错误');$('#date').textContent=DATA.snapshot;const favorites=load('llmpr-stars',[]);state.favorites=Array.isArray(favorites)?favorites.filter(id=>getItem(id)):[];const savedRegion=load('llmpr-plan-region',{});state.planRegion=savedRegion&&typeof savedRegion==='object'&&!Array.isArray(savedRegion)?savedRegion:{};const savedCol=load('llmpr-collapsed',{});state.collapsed=savedCol&&typeof savedCol==='object'&&!Array.isArray(savedCol)?savedCol:{};const recs=load('llmpr-mvp-records',[]);state.records=Array.isArray(recs)?recs.filter(r=>r&&getItem(r.modelId)&&Array.isArray(r.values)&&r.values.length===5&&Number.isFinite(r.total)&&Number.isFinite(Date.parse(r.time))).slice(0,20):[];readRoute()}catch(err){$('#view-content').innerHTML=empty('价格快照无法读取','请重新打开原始 HTML 文件。如果仍然出错，文件可能不完整。','重新加载','reload');$('#filters').hidden=true;document.querySelector('[data-action="reload"]').onclick=()=>location.reload()}}
boot();
</script></body></html>
