function updateBill(m,root){if(!root)return;const b=computeBill(rate(m),draft(m).values);
 b.parts.forEach((p,i)=>{const row=root.querySelector(`[data-field="${i}"]`);if(!row)return;const bad=p.status==='invalid'||p.status==='missing';row.classList.toggle('invalid',bad);row.querySelector('input').setAttribute('aria-invalid',p.status==='invalid'?'true':'false');row.querySelector('output').innerHTML=p.status==='invalid'?'—<small>请输入有效用量</small>':p.status==='missing'?'—<small>缺少单价，未计入</small>':p.price==null?'—<small>未使用 · 未单列价</small>':money(p.amount,m.currency,4)});
 const label=root.querySelector('#total-label'),amount=root.querySelector('#total-amount'),status=root.querySelector('#calc-status');
 label.innerHTML=(b.incomplete?'已知项小计':'预计费用')+`<small>${m.currency} · ${b.incomplete?'费用不完整':'不含税费及其他附加项'}</small>`;
 amount.textContent=b.invalid?'—':money(b.total??b.subtotal,m.currency,4);amount.parentElement.classList.toggle('incomplete',b.incomplete||b.invalid);
 status.textContent=b.invalid?'请输入 0–1,000,000 之间的有效用量；空白不是零。':b.incomplete?'有用量的费用项缺少单价，请核对官方说明后再保存。':'已按当前档位计算 · 保存后可恢复全部输入';status.classList.toggle('error',b.invalid||b.incomplete);
 root.querySelector('[data-action="save-calc"]').disabled=b.total===null;
}

}
function renderHelp(){openModal('help',`<h2 id="modal-title">使用说明</h2><p class="modal-sub">先看价格口径，再比较实际费用。</p><div class="help"><h3>模型与计费档位</h3><p>输入、输出、缓存读取和写入均以百万 token 为单位。切换缓存时长、上下文档位或峰谷时段后，用量会保留。DeepSeek 的档位由你选择，本版不以星期推断法定节假日。</p><h3>缓存与不完整费用</h3><p>未缓存输入、读取和写入是互不重叠的用量。显式缓存可能另收存储费，单位为百万 token·小时。缺少单价且填写用量时，只显示“已知项小计”，不能保存为完整试算。空白、负数或超范围输入会就地提示。</p><h3>Coding Plan</h3><p>展示常规月付价，“起”代表最低档起价；促销与使用限制在详情列出。额度窗口、积分、请求数不能互相等价，也不能等同于 API 余额。</p><h3>快照与离线</h3><p>本次界面 MVP 使用上传项目的 ${E(DATA.snapshot)} 快照，未重新核价。所有数据、样式与脚本均已内置；离线可搜索、比较和试算，打开来源需联网。本文件没有账户登录或购买功能。</p><h3>快捷操作与本地保存</h3><p>⌘ / Ctrl + K 定位搜索，Tab 切换控件，Esc 返回。关注与最近 20 条试算保存在当前浏览器。导出仅包含当前筛选结果；USD 与 CNY 分开排序和比较，不做汇率换算。</p></div>`)}
function exportCSV(){if(!filtered.length)return;const models=mode()==='models';const headers=models?['模型ID','名称','供应商','币种','档位','输入/百万tokens','输出/百万tokens','缓存读取/百万tokens','缓存写入/百万tokens','缓存存储/百万token小时','快照日期','来源']:['套餐','供应商','币种','月付价格','是否起价','包含额度','适用工具','使用边界','首月优惠','快照日期','来源'];const rows=filtered.map(x=>isModel(x)?[x.id,x.name,x.provider,x.currency,rate(x).label,rate(x).input,rate(x).output,rate(x).read??'未单列',rate(x).write??'未单列',rate(x).storage??'不适用/未列',DATA.snapshot,source(x.source)?.url??'']:[x.name,x.provider,x.currency,x.price,x.starting?'是':'否',x.quota,x.tools,x.note,x.promo||'',DATA.snapshot,source(x.source)?.url??'']);const csv='\uFEFF'+[headers,...rows].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='llm-price-radar-'+(models?'models':'coding-plans')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify(`已导出当前筛选的 ${filtered.length} 项。`)}
$('#search').addEventListener('input',e=>{state.query=e.target.value;render()});
$('#provider').onchange=e=>{state.provider=e.target.value;render()};$('#currency').onchange=e=>{state.currency=e.target.value;render()};$('#sort').onchange=e=>{state.sort=e.target.value;render()};$('#export').onclick=exportCSV;
document.addEventListener('change',e=>{if(e.target.matches('[data-compare]'))compareToggle(e.target.dataset.compare);if(e.target.id==='detail-tier'){const m=activeItem();draft(m).tier=Number(e.target.value);render();if(modalType==='detail')refreshDetail();const root=modalType==='detail'?$('#modal-body'):$('#detail');root?.querySelector('#detail-tier')?.focus()}});
document.addEventListener('input',e=>{if(!e.target.matches('[data-usage]'))return;const m=activeItem();draft(m).values[Number(e.target.dataset.usage)]=e.target.value;updateBill(m,e.target.closest('.inspector'))});
document.addEventListener('click',e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.matches('.brand')){e.preventDefault();route('models');return}
 if(b.dataset.view){closeModal(false);route(b.dataset.view);return}
 if(b.dataset.kind){state.kind=b.dataset.kind;state.compare=[];resetFilters();return}
 if(b.dataset.open){displayDetail(b.dataset.open);return}
 if(b.dataset.star){star(b.dataset.star);return}
 if(b.dataset.compareButton){compareToggle(b.dataset.compareButton);return}
 if(b.dataset.step){const id=mode()==='models'?state.selected:state.planSelected;const i=filtered.findIndex(x=>x.id===id)+Number(b.dataset.step);if(filtered[i])displayDetail(filtered[i].id);return}
 if(b.dataset.record){restoreRecord(b.dataset.record);return}
 if(b.dataset.delete){const previous=[...state.records];state.records=state.records.filter(r=>r.id!==b.dataset.delete);save('llmpr-mvp-records',state.records);renderHistory();notify('已删除试算记录。');return}
 switch(b.dataset.action){case 'sources':route('sources');break;case 'models':case 'browse':route(mode()==='plans'?'plans':'models');break;case 'help':renderHelp();break;case 'reset':resetFilters();break;case 'clear-compare':state.compare=[];render();break;case 'compare':renderCompare();break;case 'close':closeModal();break;case 'recover':closeModal();route('models');break;case 'save-calc':saveCalculation();break;case 'reset-usage':{const m=activeItem();draft(m).values=['1','0','0','.5','0'];refreshDetail();break}}
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#modal').open)closeModal();if(!['models','plans','saved'].includes(state.view))route('models');$('#search').focus()}if(e.key==='Escape'&&!$('#modal').open&&state.query){resetFilters();$('#search').focus()}});
narrow.addEventListener('change',()=>{if(!narrow.matches&&modalType==='detail')closeModal();render()});
function offline(){ $('#offline').hidden=navigator.onLine }window.addEventListener('online',offline);window.addEventListener('offline',offline);offline();
function boot(){try{DATA=JSON.parse($('#model-data').textContent);PLANS=JSON.parse($('#plan-data').textContent);if(!Array.isArray(DATA.models)||!DATA.models.length||!Array.isArray(PLANS.plans)||!DATA.models.every(m=>m.id&&Array.isArray(m.rates)&&m.rates.length))throw Error('数据格式错误');$('#date').textContent=DATA.snapshot;const favorites=load('llmpr-stars',[]);state.favorites=Array.isArray(favorites)?favorites.filter(id=>getItem(id)):[];const recs=load('llmpr-mvp-records',[]);state.records=Array.isArray(recs)?recs.filter(r=>r&&getItem(r.modelId)&&Array.isArray(r.values)&&r.values.length===5&&Number.isFinite(r.total)&&Number.isFinite(Date.parse(r.time))).slice(0,20):[];readRoute()}catch(err){$('#view-content').innerHTML=empty('价格快照无法读取','请重新打开原始 HTML 文件。如果仍然出错，文件可能不完整。','重新加载','reload');$('#filters').hidden=true;document.querySelector('[data-action="reload"]').onclick=()=>location.reload()}}
boot();
</script></body></html>
